<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset Assigned / Gate Pass Automation</title>
  
  <!-- CDNs for PDF & Icons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --primary: #1e40af;
      --bg-dark: #334155;
      --panel: #ffffff;
      --border: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* LEFT CONTROLS PANEL */
    .form-container {
      width: 430px;
      min-width: 410px;
      height: 100%;
      background: var(--panel);
      border-right: 2px solid #1e293b;
      padding: 16px;
      overflow-y: auto;
      box-shadow: 4px 0 15px rgba(0,0,0,0.25);
      z-index: 10;
    }

    .form-header {
      padding-bottom: 8px;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 10px;
    }

    .form-header h2 {
      font-size: 17px;
      color: #0f172a;
    }

    /* Page Switcher Tabs */
    .page-switcher {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: #f1f5f9;
      padding: 5px;
      border-radius: 5px;
    }

    .tab-btn {
      padding: 4px 8px;
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-add-page {
      background: #10b981;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-clear-data {
      background: #f59e0b;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
      margin-left: auto;
    }

    .btn-delete-page {
      background: #ef4444;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    /* Form Section */
    .form-section {
      background: #f8fafc;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      margin-bottom: 10px;
    }

    .form-section h3 {
      font-size: 11.5px;
      color: #334155;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .form-group {
      margin-bottom: 6px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      color: #475569;
      margin-bottom: 2px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 5px 7px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 11.5px;
    }

    /* Item Cards */
    .item-input-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }

    .item-input-card .row-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
      font-size: 10.5px;
      font-weight: bold;
      color: #64748b;
    }

    .item-input-card textarea {
      width: 100%;
      font-size: 11.5px;
      padding: 4px 6px;
      margin-bottom: 4px;
      border: 1px solid #cbd5e1;
      border-radius: 3px;
      resize: vertical;
    }

    .item-input-card .row-bottom {
      display: grid;
      grid-template-columns: 1fr 2fr 28px;
      gap: 5px;
    }

    .btn-del-item {
      background: #fee2e2;
      color: #ef4444;
      border: 1px solid #fca5a5;
      border-radius: 3px;
      cursor: pointer;
    }

    .btn-add-item {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 6px;
      border-radius: 4px;
      font-size: 11.5px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Bottom Actions */
    .action-bar {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: sticky;
      bottom: 0;
      background: white;
      padding-top: 8px;
      border-top: 2px solid #e2e8f0;
    }

    .btn-action-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
    }

    .btn-action {
      padding: 8px 4px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
    }

    .btn-print { background: #059669; color: white; }
    .btn-pdf { background: #dc2626; color: white; }
    .btn-word { background: #2563eb; color: white; }

    /* RIGHT PREVIEW CANVAS */
    .preview-container {
      flex: 1;
      height: 100%;
      background: #1e293b;
      overflow: auto;
      padding: 20px;
      display: flex;
      flex-direction: row;
      justify-content: flex-start;
      gap: 20px;
    }

    /* Standard A4 Paper Style (Exact dimensions to strictly fit in 1 page) */
    .a4-page {
      width: 210mm;
      min-width: 210mm;
      height: 295mm; /* strictly constrained to 295mm to prevent 2nd page in PDF */
      max-height: 295mm;
      background: #ffffff;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
      padding: 12mm 16mm;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #000;
      overflow: hidden;
      page-break-after: always;
      page-break-inside: avoid;
    }

    .doc-top-right {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 4px;
    }

    .gate-pass-box {
      border: 1.5px solid #000;
      padding: 3px 18px;
      font-weight: bold;
      font-size: 14.5px;
    }

    .doc-header {
      text-align: center;
      margin-bottom: 8px;
    }

    .doc-header h1 {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 1px;
    }

    .doc-header .address {
      font-size: 11px;
      margin-bottom: 1px;
    }

    .doc-header .hotline {
      font-size: 11px;
      font-style: italic;
      margin-bottom: 5px;
    }

    .badge-bar {
      background-color: #000;
      color: #fff;
      display: inline-block;
      padding: 2px 20px;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .dept-title {
      font-size: 12.5px;
      font-weight: bold;
    }

    /* Meta Table */
    .meta-table {
      width: 100%;
      margin: 10px 0 6px 0;
      font-size: 12px;
      border-collapse: collapse;
    }

    .meta-table td {
      padding: 2px 0;
    }

    .meta-table td.label { width: 14%; }
    .meta-table td.val { width: 36%; }

    /* Item Details Table */
    .table-title {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .main-table-wrapper {
      border: 1.5px solid #000;
      display: flex;
      flex-direction: column;
      height: 420px; /* Adjusted height so page never overflows */
    }

    .item-table {
      width: 100%;
      border-collapse: collapse;
      height: 100%;
    }

    .item-table th {
      border-bottom: 1.5px solid #000;
      border-right: 1.5px solid #000;
      padding: 4px 6px;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
    }

    .item-table th:last-child {
      border-right: none;
    }

    .item-table td {
      border-right: 1.5px solid #000;
      padding: 5px 8px;
      font-size: 11.5px;
      vertical-align: top;
    }

    .item-table td:last-child {
      border-right: none;
    }

    .col-sl { width: 7%; text-align: center; font-weight: bold; }
    .col-details { width: 53%; font-weight: bold; line-height: 1.3; }
    .col-qty { width: 10%; text-align: center; font-weight: bold; }
    .col-purpose { width: 30%; }

    /* One clean filler row */
    .filler-row td {
      height: 100%;
    }

    .total-row {
      border-top: 1.5px solid #000;
      height: 24px;
    }

    .total-row td {
      border-right: 1.5px solid #000;
      font-weight: bold;
      font-size: 12px;
      padding: 2px 6px;
    }

    .notice-line {
      font-size: 10.5px;
      margin-top: 5px;
    }

    .remarks-section {
      margin-top: 10px;
      font-size: 11.5px;
      min-height: 40px;
    }

    .remarks-label {
      font-weight: bold;
      font-style: italic;
    }

    /* Signatures Bottom */
    .signature-area {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .sig-box {
      width: 130px;
      border-top: 1.5px solid #000;
      text-align: center;
      font-size: 12px;
      padding-top: 3px;
    }

    /* Native Print */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      body {
        background: white !important;
        overflow: visible !important;
        display: block !important;
      }
      .form-container { display: none !important; }
      .preview-container { padding: 0 !important; background: white !important; display: block !important; overflow: visible !important; }
      .a4-page {
        box-shadow: none !important;
        margin: 0 !important;
        width: 210mm !important;
        height: 295mm !important;
        page-break-after: always !important;
        page-break-inside: avoid !important;
        padding: 12mm 16mm !important;
      }
    }
  </style>
</head>
<body>

  <!-- LEFT CONTROL FORM -->
  <div class="form-container">
    <div class="form-header">
      <h2><i class="fa-solid fa-file-invoice"></i> Gate Pass Generator</h2>
      <p style="font-size: 11px; color: #64748b; margin-top: 2px;">ইনপুট পরিবর্তন করলে প্রিভিউ আপডেট হবে।</p>
    </div>

    <!-- Page Switcher Tabs -->
    <div class="page-switcher">
      <div id="page-tabs-container" style="display:flex; gap: 4px;"></div>
      <button class="btn-add-page" onclick="addNewPage()" title="নতুন পেজ যোগ করুন"><i class="fa fa-plus"></i> Add</button>
      <button class="btn-clear-data" onclick="clearCurrentPageData()" title="এই পেজের সব তথ্য মুছে খালি করুন"><i class="fa fa-eraser"></i> Clear</button>
      <button class="btn-delete-page" onclick="deleteCurrentPage()" title="পেজ ডিলিট করুন"><i class="fa fa-trash"></i></button>
    </div>

    <!-- Page Info -->
    <div class="form-section">
      <h3>1. Document & Pass Info</h3>
      <div class="form-group">
        <label>Gate pass- No:</label>
        <input type="text" id="inp_gatepass" oninput="saveCurrentData()">
      </div>
    </div>

    <!-- Employee & Location -->
    <div class="form-section">
      <h3>2. Personnel & Branch Details</h3>
      <div class="grid-2">
        <div class="form-group">
          <label>Workplace:</label>
          <input type="text" id="inp_workplace" oninput="saveCurrentData()">
        </div>
        <div class="form-group">
          <label>Date:</label>
          <input type="text" id="inp_date" oninput="saveCurrentData()">
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Emp ID:</label>
          <input type="text" id="inp_empid" oninput="saveCurrentData()">
        </div>
        <div class="form-group">
          <label>Emp Name:</label>
          <input type="text" id="inp_empname" oninput="saveCurrentData()">
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Designation:</label>
          <input type="text" id="inp_desig" oninput="saveCurrentData()">
        </div>
        <div class="form-group">
          <label>Department:</label>
          <input type="text" id="inp_dept" oninput="saveCurrentData()">
        </div>
      </div>
    </div>

    <!-- Dynamic Items -->
    <div class="form-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <h3>3. Dynamic Item Details</h3>
      </div>
      <div id="item-input-list"></div>
      <button class="btn-add-item" onclick="addItem()"><i class="fa fa-plus-circle"></i> Add Item Row</button>
    </div>

    <!-- Remarks -->
    <div class="form-section">
      <h3>4. Remarks</h3>
      <div class="form-group">
        <textarea id="inp_remarks" rows="2" placeholder="Remarks..." oninput="saveCurrentData()"></textarea>
      </div>
    </div>

    <!-- Actions -->
    <div class="action-bar">
      <div class="btn-action-group">
        <button class="btn-action btn-print" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
        <button class="btn-action btn-pdf" onclick="downloadPDF()"><i class="fa-solid fa-file-pdf"></i> PDF</button>
        <button class="btn-action btn-word" onclick="downloadWord()"><i class="fa-solid fa-file-word"></i> Word (.doc)</button>
      </div>
    </div>
  </div>

  <!-- RIGHT LIVE PREVIEW -->
  <div class="preview-container" id="preview-container"></div>

  <script>
    let pages = [
      {
        gatepass: "CBE-001",
        workplace: "Rangamati-Sadar",
        date: "2026-09-27",
        empid: "CL-84977",
        empname: "Jana Prio Chakma",
        desig: "Associate",
        dept: "Hub Operations (OSD)",
        remarks: "",
        items: [
          {
            details: "HP Probook 440 G8, i5 11th Gen, RAM 16GB, SSD 512 GB, 14-inch, SN# 5CD1159L99, BSN# 5CD1159L99 & TN# CBE-IT-LAPTOP-0475",
            qty: 1,
            purpose: "New"
          },
          {
            details: "Laptop Charger",
            qty: 1,
            purpose: ""
          },
          {
            details: "Headphone, Logitech-H111, TN# CBE-IT-Headphone-120",
            qty: 1,
            purpose: ""
          }
        ]
      }
    ];

    let activePageIndex = 0;

    function loadForm() {
      const p = pages[activePageIndex];
      document.getElementById('inp_gatepass').value = p.gatepass || '';
      document.getElementById('inp_workplace').value = p.workplace || '';
      document.getElementById('inp_date').value = p.date || '';
      document.getElementById('inp_empid').value = p.empid || '';
      document.getElementById('inp_empname').value = p.empname || '';
      document.getElementById('inp_desig').value = p.desig || '';
      document.getElementById('inp_dept').value = p.dept || '';
      document.getElementById('inp_remarks').value = p.remarks || '';

      renderPageTabs();
      renderItemInputs();
      renderPreview();
    }

    function saveCurrentData() {
      const p = pages[activePageIndex];
      p.gatepass = document.getElementById('inp_gatepass').value;
      p.workplace = document.getElementById('inp_workplace').value;
      p.date = document.getElementById('inp_date').value;
      p.empid = document.getElementById('inp_empid').value;
      p.empname = document.getElementById('inp_empname').value;
      p.desig = document.getElementById('inp_desig').value;
      p.dept = document.getElementById('inp_dept').value;
      p.remarks = document.getElementById('inp_remarks').value;

      renderPreview();
      renderPageTabs();
    }

    function renderPageTabs() {
      const container = document.getElementById('page-tabs-container');
      container.innerHTML = '';
      pages.forEach((p, index) => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${index === activePageIndex ? 'active' : ''}`;
        btn.innerText = `P${index + 1} (${p.gatepass || 'Blank'})`;
        btn.onclick = () => {
          activePageIndex = index;
          loadForm();
        };
        container.appendChild(btn);
      });
    }

    function addNewPage() {
      const nextNum = pages.length + 1;
      const formattedNum = String(nextNum).padStart(3, '0');
      pages.push({
        gatepass: `CBE-${formattedNum}`,
        workplace: "",
        date: new Date().toISOString().split('T')[0],
        empid: "",
        empname: "",
        desig: "",
        dept: "",
        remarks: "",
        items: [{ details: "", qty: 1, purpose: "" }]
      });
      activePageIndex = pages.length - 1;
      loadForm();
    }

    function clearCurrentPageData() {
      if (confirm("আপনি কি বর্তমান পেজের সব তথ্য মুছে সম্পূর্ণ খালি করতে চান?")) {
        const p = pages[activePageIndex];
        p.gatepass = "";
        p.workplace = "";
        p.date = "";
        p.empid = "";
        p.empname = "";
        p.desig = "";
        p.dept = "";
        p.remarks = "";
        p.items = [{ details: "", qty: 1, purpose: "" }];
        loadForm();
      }
    }

    function deleteCurrentPage() {
      if (pages.length <= 1) {
        if (confirm("এটি একমাত্র পেজ। আপনি কি পেজের সব তথ্য মুছে সম্পূর্ণ খালি (Clear/Reset) করতে চান?")) {
          const p = pages[0];
          p.gatepass = "";
          p.workplace = "";
          p.date = "";
          p.empid = "";
          p.empname = "";
          p.desig = "";
          p.dept = "";
          p.remarks = "";
          p.items = [{ details: "", qty: 1, purpose: "" }];
          loadForm();
        }
        return;
      }

      if (confirm(`আপনি কি পেজ ${activePageIndex + 1} (${pages[activePageIndex].gatepass || 'No-Name'}) মুছে ফেলতে চান?`)) {
        pages.splice(activePageIndex, 1);
        activePageIndex = Math.max(0, activePageIndex - 1);
        loadForm();
      }
    }

    function renderItemInputs() {
      const list = document.getElementById('item-input-list');
      list.innerHTML = '';
      pages[activePageIndex].items.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'item-input-card';
        card.innerHTML = `
          <div class="row-top">
            <span>SL: ${String(idx + 1).padStart(2, '0')}</span>
            <button class="btn-del-item" onclick="deleteItem(${idx})" title="মুছুন"><i class="fa fa-times"></i></button>
          </div>
          <textarea rows="2" placeholder="IT Asset Details..." oninput="updateItem(${idx}, 'details', this.value)">${item.details}</textarea>
          <div class="row-bottom">
            <input type="number" min="1" placeholder="Qty" value="${item.qty}" oninput="updateItem(${idx}, 'qty', this.value)">
            <input type="text" placeholder="Purpose (e.g. New)" value="${item.purpose}" oninput="updateItem(${idx}, 'purpose', this.value)">
          </div>
        `;
        list.appendChild(card);
      });
    }

    function addItem() {
      pages[activePageIndex].items.push({ details: '', qty: 1, purpose: '' });
      renderItemInputs();
      renderPreview();
    }

    function deleteItem(idx) {
      if (pages[activePageIndex].items.length <= 1) {
        pages[activePageIndex].items[0] = { details: '', qty: 1, purpose: '' };
      } else {
        pages[activePageIndex].items.splice(idx, 1);
      }
      renderItemInputs();
      renderPreview();
    }

    function updateItem(idx, key, value) {
      pages[activePageIndex].items[idx][key] = value;
      renderPreview();
    }

    function renderPreview() {
      const container = document.getElementById('preview-container');
      container.innerHTML = '';

      pages.forEach((page, pIdx) => {
        let totalQty = 0;
        let itemRowsHtml = '';

        page.items.forEach((item, idx) => {
          const q = parseInt(item.qty) || 0;
          totalQty += q;
          const sl = String(idx + 1).padStart(2, '0');
          itemRowsHtml += `
            <tr>
              <td class="col-sl">${sl}</td>
              <td class="col-details">${item.details || '&nbsp;'}</td>
              <td class="col-qty">${item.qty || '0'}</td>
              <td class="col-purpose">${item.purpose || '&nbsp;'}</td>
            </tr>
          `;
        });

        const pageHtml = `
          <div class="a4-page" id="render-page-${pIdx}">
            <div>
              <div class="doc-top-right">
                <div class="gate-pass-box">
                  Gate pass- No: ${page.gatepass || ''}
                </div>
              </div>

              <div class="doc-header">
                <h1>CarryBee Express Ltd.</h1>
                <div class="address">House 97, Soharwardi Avenue, Baridhara Diplomatic Zone, Dhaka 1212</div>
                <div class="hotline">IT Hotline: 01701208286</div>
                <div><span class="badge-bar">IT Asset Assigned / Gate Pass Form</span></div>
                <div class="dept-title">IT & Infrastructure Department</div>
              </div>

              <table class="meta-table">
                <tr>
                  <td class="label">Workplace:</td>
                  <td class="val">${page.workplace || ''}</td>
                  <td class="label">Date:</td>
                  <td class="val">${page.date || ''}</td>
                </tr>
                <tr>
                  <td class="label">Emp ID:</td>
                  <td class="val">${page.empid || ''}</td>
                  <td class="label">Emp Name:</td>
                  <td class="val">${page.empname || ''}</td>
                </tr>
                <tr>
                  <td class="label">Designation:</td>
                  <td class="val">${page.desig || ''}</td>
                  <td class="label">Department:</td>
                  <td class="val">${page.dept || ''}</td>
                </tr>
              </table>

              <div class="table-title">Item Details:</div>
              <div class="main-table-wrapper">
                <table class="item-table">
                  <thead>
                    <tr>
                      <th class="col-sl">SL.</th>
                      <th class="col-details">IT Asset Details</th>
                      <th class="col-qty">Qty</th>
                      <th class="col-purpose">Purpose</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${itemRowsHtml}
                    <tr class="filler-row">
                      <td class="col-sl"></td>
                      <td class="col-details"></td>
                      <td class="col-qty"></td>
                      <td class="col-purpose"></td>
                    </tr>
                  </tbody>
                  <tfoot>
                    <tr class="total-row">
                      <td colspan="2" style="text-align: right; padding-right: 12px;">Total</td>
                      <td class="col-qty" style="text-align: center;">${totalQty}</td>
                      <td></td>
                    </tr>
                  </tfoot>
                </table>
              </div>

              <div class="notice-line">NB: Please acknowledge by (email: it@carrybee.com) upon item received.</div>

              <div class="remarks-section">
                <span class="remarks-label">Remarks:</span> ${page.remarks || ''}
              </div>
            </div>

            <div class="signature-area">
              <div class="sig-box">Prepared By</div>
              <div class="sig-box">Authorized by</div>
              <div class="sig-box">Received by</div>
            </div>
          </div>
        `;
        container.innerHTML += pageHtml;
      });
    }

    function getFilenameDate() {
      const curDateStr = pages[0].date || '';
      const parts = curDateStr.split('-');
      if(parts.length === 3 && parts[0].length === 4) {
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
      }
      return curDateStr || '27-09-2026';
    }

    // PDF Download strictly constrained to 1 single page per gate pass
    function downloadPDF() {
      const element = document.getElementById('preview-container');
      const filename = `IT Asset Assigned-Gate Pass Form - ${getFilenameDate()}.pdf`;

      const opt = {
        margin:       0,
        filename:     filename,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak:    { mode: ['css', 'legacy'] }
      };

      html2pdf().set(opt).from(element).save();
    }

    // Word Download - NO EXTRA BOXES, ONE BIG CLEAN SPACE
    function downloadWord() {
      const filename = `IT Asset Assigned-Gate Pass Form - ${getFilenameDate()}.doc`;
      
      let pagesHtml = '';

      pages.forEach((p, idx) => {

            <tr style="height: 22pt;">
              <td align="center" style="border: 1pt solid black; font-weight: bold; width: 7%;">${String(itemIdx + 1).padStart(2, '0')}</td>

        // Single continuous blank filler row without intermediate horizontal borders
        itemRows += `
          <tr style="height: 230pt;">
            <td style="border-left: 1pt solid black; border-right: 1pt solid black; border-top: none; border-bottom: none;">&nbsp;</td>
            <td style="border-right: 1pt solid black; border-top: none; border-bottom: none;">&nbsp;</td>
            <td style="border-right: 1pt solid black; border-top: none; border-bottom: none;">&nbsp;</td>
            <td style="border-right: 1pt solid black; border-top: none; border-bottom: none;">&nbsp;</td>
          </tr>
        `;

        pagesHtml += `
          <div class="WordSection">
            <!-- Gate Pass Top Box -->
            <table width="100%" border="0" cellspacing="0" cellpadding="0">
              <tr>
                <td align="right">
                  <table border="1" cellspacing="0" cellpadding="3" style="border: 1.5pt solid black; border-collapse: collapse;">
                    <tr>
                      <td style="font-weight: bold; font-size: 11pt; padding: 2pt 14pt;">Gate pass- No: ${p.gatepass || ''}</td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

            <!-- Header Titles -->
            <div align="center" style="text-align: center; margin-top: 3pt;">
              <h2 style="margin: 0; font-size: 17pt; font-family: Arial; font-weight: bold;">CarryBee Express Ltd.</h2>
              <div style="font-size: 9pt; margin-top: 2pt;">House 97, Soharwardi Avenue, Baridhara Diplomatic Zone, Dhaka 1212</div>
              <div style="font-size: 9pt; font-style: italic; margin-top: 1pt;">IT Hotline: 01701208286</div>
              
              <table align="center" border="0" cellspacing="0" cellpadding="0" style="margin-top: 4pt; margin-bottom: 3pt;">
                <tr>
                  <td bgcolor="#000000" style="background: #000000; color: #ffffff; padding: 2pt 18pt; font-size: 10.5pt; font-weight: bold; text-align: center;">
                    IT Asset Assigned / Gate Pass Form
                  </td>
                </tr>
              </table>
              <div style="font-size: 10pt; font-weight: bold; margin-top: 1pt;">IT & Infrastructure Department</div>
            </div>

            <!-- Meta details -->
            <table width="100%" border="0" cellspacing="0" cellpadding="2" style="margin-top: 8pt; font-size: 9.5pt; font-family: Arial;">
              <tr>
                <td width="15%">Workplace:</td>
                <td width="35%"><b>${p.workplace || ''}</b></td>
                <td width="15%">Date:</td>
                <td width="35%"><b>${p.date || ''}</b></td>
              </tr>
              <tr>
                <td>Emp ID:</td>
                <td><b>${p.empid || ''}</b></td>
                <td>Emp Name:</td>
                <td><b>${p.empname || ''}</b></td>
              </tr>
              <tr>
                <td>Designation:</td>
                <td><b>${p.desig || ''}</b></td>
                <td>Department:</td>
                <td><b>${p.dept || ''}</b></td>
              </tr>
            </table>

            <!-- Item Table -->
            <div style="font-weight: bold; font-size: 9.5pt; margin-top: 8pt; margin-bottom: 2pt;">Item Details:</div>
            <table width="100%" cellpadding="3" cellspacing="0" style="border-collapse: collapse; font-family: Arial; font-size: 9pt;">
              <thead>
                <tr style="height: 18pt; background: #fafafa;">
                  <th align="center" style="border: 1pt solid black; width: 7%;">SL.</th>
                  <th align="center" style="border: 1pt solid black; width: 53%;">IT Asset Details</th>
                  <th align="center" style="border: 1pt solid black; width: 10%;">Qty</th>
                  <th align="center" style="border: 1pt solid black; width: 30%;">Purpose</th>
                </tr>
              </thead>
              <tbody>
                ${itemRows}

              <tfoot>
                <tr style="height: 18pt; font-weight: bold;">
                  <td colspan="2" align="right" style="border: 1pt solid black; padding-right: 8pt;">Total</td>
                  <td align="center" style="border: 1pt solid black;">${totalQty}</td>
                  <td style="border: 1pt solid black;"></td>
                </tr>
              </tfoot>
            </table>

            <div style="font-size: 8.5pt; margin-top: 4pt; font-family: Arial;">NB: Please acknowledge by (email: it@carrybee.com) upon item received.</div>

            <div style="margin-top: 10pt; font-size: 9.5pt; font-family: Arial;">
              <b><i>Remarks:</i></b> ${p.remarks || ''}
            </div>

            <!-- Signatures Side-by-side using Table -->
            <table width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-top: 45pt; font-family: Arial; font-size: 9.5pt;">
              <tr>
                <td align="center" width="30%">
                  <div style="border-top: 1.5pt solid black; padding-top: 3pt; width: 120pt;">Prepared By</div>

      const fullWordHtml = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office'

      const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(fullWordHtml);
      const fileDownload = document.createElement("a");
      document.body.appendChild(fileDownload);
      fileDownload.href = source;
      fileDownload.download = filename;
      fileDownload.click();
      document.body.removeChild(fileDownload);
    }

    loadForm();
  </script>
</body>
